spring.application.name=techservices-backend
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# PostgreSQL (valores padrão podem ser sobrescritos por variáveis de ambiente)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/techservices}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Cria/atualiza as tabelas a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# CORS — origens do frontend React (separadas por vírgula)
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Popula o catálogo com serviços de exemplo quando a tabela estiver vazia
app.seed.enabled=true
